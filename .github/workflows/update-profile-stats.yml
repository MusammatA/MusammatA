name: Update Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python syntax
        run: PYTHONPYCACHEPREFIX=/tmp/codex-pyc python -m py_compile scripts/generate_profile_stats.py generate_typographic_portrait.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Generate monochrome profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: MusammatA
        run: python scripts/generate_profile_stats.py

      - name: Commit refreshed cards
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/profile-stats; then
            echo "No profile stat changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats
          git commit -m "Update profile stats"
          git push
