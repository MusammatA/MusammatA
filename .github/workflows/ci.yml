name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python syntax
        run: PYTHONPYCACHEPREFIX=/tmp/codex-pyc python -m py_compile scripts/generate_profile_stats.py generate_typographic_portrait.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
